<!DOCTYPE html>
<html>
<head>
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz">

  <div id="start">
    <h1>Computer Science Quiz</h1>
    <p>10 questions | 60 seconds each</p>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <div id="game" class="hide">
    <p>Question <span id="num"></span>/10</p>
    <p>Score: <span id="score">0</span></p>
    <p>Time: <span id="time">60</span>s</p>

    <div class="card">
      <h2 id="question"></h2>
      <div id="answers"></div>
      <p id="feedback"></p>
      <button id="next" class="hide" onclick="nextQuestion()">
        Next
      </button>
    </div>
  </div>

  <div id="result" class="hide">
    <h1>Quiz Completed 🎉</h1>
    <h2>Score: <span id="final"></span>/10</h2>
    <div id="results"></div>
    <button onclick="location.reload()">Restart</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
